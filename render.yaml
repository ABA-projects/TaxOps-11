services:
  - type: web
    name: taxops-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile-api
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health

    envVars:
      - key: DATABASE_URL
        sync: false          # Set manually in Render dashboard
      - key: SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: ALLOWED_ORIGINS
        value: "https://taxops.vercel.app,http://localhost:3000"
      - key: PORT
        value: "8000"

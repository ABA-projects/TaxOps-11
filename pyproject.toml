[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taxops"
version = "0.2.0"
description = "Automatización contable Colombia — Facturas DIAN y Exógenas"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.11.4",
    "lxml>=5.3.0",
    "python-docx>=1.1.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.5",
    "streamlit>=1.36.0",
    "groq>=0.11",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "streamlit-authenticator==0.3.3",
    "bcrypt>=4.0",
    "python-dotenv>=1.0",
]

[project.scripts]
taxops = "cli:main"

[tool.setuptools]
# Módulos sueltos en la raíz (Home.py, cli.py, main.py)
py-modules = ["cli", "Home", "main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*", "exogenas*", "services*", "utils*", "db*", "pages*"]

[tool.setuptools.package-data]
"pipeline"  = ["autorretenedores.txt"]
"exogenas"  = ["*.txt"]
"db"        = ["*.sql"]
"static"    = ["*.svg"]
"*"         = [".streamlit/config.toml"]

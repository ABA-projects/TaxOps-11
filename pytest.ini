[pytest]
# `agents` se incluye a propósito: hasta 2026-09-04 solo estaba `tests`, así que los 19 tests
# de los agentes NUNCA corrían en CI y podían pudrirse sin que nadie se enterara.
# Los archivos de test de cada agente llevan el nombre del agente como sufijo porque pytest
# colisiona si dos archivos de test comparten basename. Se evita a propósito
# --import-mode=importlib: cambiaría el sys.path de TODA la suite y rompe los tests que importan
# módulos de la raíz del repo (p. ej. tests/test_chatbot.py hace `from chatbot import ...`).
testpaths = tests agents
addopts = -v --tb=short

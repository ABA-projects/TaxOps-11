[pytest]
# `agents` se incluye a propósito: hasta 2026-09-04 solo estaba `tests`, así que los ~25 tests
# de los agentes NUNCA corrían en CI y podían pudrirse sin que nadie se enterara.
# import-mode=importlib permite que los 4 agentes tengan archivos con el mismo basename
# (test_agent.py, test_publish.py) sin que pytest colisione los nombres de módulo.
testpaths = tests agents
addopts = -v --tb=short --import-mode=importlib

name: Terraform Plan

on:
  pull_request:
    paths: ["infra/**"]

permissions:
  id-token: write # requerido para autenticar contra AWS vía OIDC
  contents: read

concurrency:
  group: terraform-prod
  cancel-in-progress: false # nunca cancelar un plan/apply a medias

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/environments/prod
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }} # el provider cloudflare lo lee solo de esta env var, sin declararlo en el .tf
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.15"

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init

      - name: terraform validate
        run: terraform validate

      - name: Generar var-file de secretos desde GitHub Secrets
        # Sin esto, var.secrets usaría el default {} en CI y el plan mostraría un
        # destroy de los parámetros SSM / las env vars de Lambda que sí existen en real.
        # El archivo vive solo en el runner efímero, nunca se commitea ni se sube como
        # artifact.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TAXOPS_SUPERADMIN_EMAILS: ${{ secrets.TAXOPS_SUPERADMIN_EMAILS }}
          BOOTSTRAP_SECRET: ${{ secrets.BOOTSTRAP_SECRET }}
          AMPLIFY_GITHUB_TOKEN: ${{ secrets.AMPLIFY_GITHUB_TOKEN }}
        run: |
          jq -n '{
            github_access_token: env.AMPLIFY_GITHUB_TOKEN,
            secrets: {
              DATABASE_URL: env.DATABASE_URL,
              SECRET_KEY: env.SECRET_KEY,
              GROQ_API_KEY: env.GROQ_API_KEY,
              GOOGLE_CLIENT_ID: env.GOOGLE_CLIENT_ID,
              GOOGLE_CLIENT_SECRET: env.GOOGLE_CLIENT_SECRET,
              TAXOPS_SUPERADMIN_EMAILS: env.TAXOPS_SUPERADMIN_EMAILS,
              BOOTSTRAP_SECRET: env.BOOTSTRAP_SECRET
            }
          }' > terraform.tfvars.secret.json

      - name: terraform plan
        run: terraform plan -var-file=terraform.tfvars.secret.json -no-color | tee /tmp/plan.txt

      - name: Publicar el plan en el resumen del job
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/plan.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

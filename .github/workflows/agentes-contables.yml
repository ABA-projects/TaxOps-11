name: Agentes contables (cron semanal)

# El cron se deshabilitó el 2026-08-25 mientras se evaluaba si estos agentes debían correr solos
# o solo on-demand desde el chatbot. Resuelto el 2026-09-13: DEPENDE DEL AGENTE.
#
#   - dian-monitor y monitor-niif SÍ van por cron. Son feeds: su valor está en estar frescos
#     cuando el contador entra a ver Novedades. Dejarlos solo on-demand significaba que si nadie
#     le preguntaba al chatbot en dos semanas, no había novedades.
#
#   - vencimientos-tributarios y prospector-clientes-contables NO. El calendario DIAN es
#     semi-estático (se publica una vez al año) y el prospector necesita sector/ciudad concretos
#     que solo el usuario aporta. Correrlos semanalmente gasta cuota de Groq sin agregar nada.
#
# Esos dos siguen disponibles vía workflow_dispatch y, sobre todo, desde el chatbot (PR #50 y
# anteriores). En el cron se saltan con un `if` explícito, no por omisión.
on:
  schedule:
    - cron: "0 11 * * 1"  # lunes 6am hora Colombia (UTC-5)
  workflow_dispatch: {}

permissions:
  id-token: write   # para el rol OIDC (escritura a S3)
  contents: read

jobs:
  # Los 4 jobs corren encadenados (needs:) en vez de en paralelo — Groq comparte un límite de
  # 8000 TPM (tokens/minuto) por cuenta entre TODOS los jobs simultáneos. Corriendo los 4 a la
  # vez, cada uno pisa el presupuesto de TPM de los demás y explotan con 429 RateLimitError casi
  # de entrada (confirmado en el run manual del 2026-08-25 — los 3 más rápidos fallaron así).
  dian-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r agents/contabilidad/dian-monitor/requirements.txt
      - run: cd agents/contabilidad/dian-monitor && python agent.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  monitor-niif:
    needs: dian-monitor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r agents/contabilidad/monitor-niif/requirements.txt
      - run: cd agents/contabilidad/monitor-niif && python agent.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  vencimientos-tributarios:
    needs: monitor-niif
    # Solo on-demand: en el cron semanal no aporta (ver cabecera del archivo).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r agents/contabilidad/vencimientos-tributarios/requirements.txt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1
      - run: cd agents/contabilidad/vencimientos-tributarios && python agent.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

  prospector-clientes-contables:
    needs: vencimientos-tributarios
    # Solo on-demand: en el cron semanal no aporta (ver cabecera del archivo).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r agents/contabilidad/prospector-clientes-contables/requirements.txt
      - run: cd agents/contabilidad/prospector-clientes-contables && python agent.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

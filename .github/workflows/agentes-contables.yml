name: Agentes contables (cron semanal)

# Cron deshabilitado (2026-08-25): se está evaluando mover los 4 agentes a invocación on-demand
# desde el chatbot en vez de cron semanal — ver docs/superpowers/specs/
# 2026-08-23-agentes-contables-integracion-design.md y la discusión post-PR #33. No se borra el
# trigger, solo se comenta, para poder reactivarlo agente por agente una vez decidido cuáles se
# quedan en cron. workflow_dispatch se deja activo para poder seguir probando manualmente.
on:
  # schedule:
  #   - cron: "0 11 * * 1"  # lunes 6am hora Colombia (UTC-5)
  workflow_dispatch: {}

permissions:
  id-token: write   # para el rol OIDC (escritura a S3)
  contents: read

jobs:
  # Los 4 jobs corren encadenados (needs:) en vez de en paralelo — Groq comparte un límite de
  # 8000 TPM (tokens/minuto) por cuenta entre TODOS los jobs simultáneos. Corriendo los 4 a la
  # vez, cada uno pisa el presupuesto de TPM de los demás y explotan con 429 RateLimitError casi
  # de entrada (confirmado en el run manual del 2026-08-25 — los 3 más rápidos fallaron así).
  dian-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r agents/contabilidad/dian-monitor/requirements.txt
      - run: cd agents/contabilidad/dian-monitor && python agent.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  monitor-niif:
    needs: dian-monitor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r agents/contabilidad/monitor-niif/requirements.txt
      - run: cd agents/contabilidad/monitor-niif && python agent.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  vencimientos-tributarios:
    needs: monitor-niif
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r agents/contabilidad/vencimientos-tributarios/requirements.txt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1
      - run: cd agents/contabilidad/vencimientos-tributarios && python agent.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

  prospector-clientes-contables:
    needs: vencimientos-tributarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r agents/contabilidad/prospector-clientes-contables/requirements.txt
      - run: cd agents/contabilidad/prospector-clientes-contables && python agent.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

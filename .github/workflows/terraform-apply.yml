name: Terraform Apply

on:
  push:
    branches: [main]
    paths: ["infra/**"]
  workflow_dispatch: {} # permite disparar manualmente desde la pestaña Actions, para probar el gate

permissions:
  id-token: write # requerido para autenticar contra AWS vía OIDC
  contents: read

concurrency:
  group: terraform-prod
  cancel-in-progress: false # nunca cancelar un plan/apply a medias

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production # requiere aprobación manual — ver Settings → Environments → production
    defaults:
      run:
        working-directory: infra/environments/prod
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }} # el provider cloudflare lo lee solo de esta env var, sin declararlo en el .tf
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.15"

      - name: terraform init
        run: terraform init

      - name: Generar var-file de secretos desde GitHub Secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TAXOPS_SUPERADMIN_EMAILS: ${{ secrets.TAXOPS_SUPERADMIN_EMAILS }}
          BOOTSTRAP_SECRET: ${{ secrets.BOOTSTRAP_SECRET }}
        run: |
          jq -n '{secrets: {
            DATABASE_URL: env.DATABASE_URL,
            SECRET_KEY: env.SECRET_KEY,
            GROQ_API_KEY: env.GROQ_API_KEY,
            GOOGLE_CLIENT_ID: env.GOOGLE_CLIENT_ID,
            GOOGLE_CLIENT_SECRET: env.GOOGLE_CLIENT_SECRET,
            TAXOPS_SUPERADMIN_EMAILS: env.TAXOPS_SUPERADMIN_EMAILS,
            BOOTSTRAP_SECRET: env.BOOTSTRAP_SECRET
          }}' > terraform.tfvars.secret.json

      - name: terraform apply
        run: terraform apply -var-file=terraform.tfvars.secret.json -auto-approve

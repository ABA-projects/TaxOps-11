# TaxOps — Deploy automático a Google Cloud Run
#
# Se activa en cada push a main.
#
# Secrets requeridos en GitHub (Settings → Secrets → Actions):
#   GCP_PROJECT_ID   → ID de tu proyecto en Google Cloud (ej: taxops-prod-123456)
#   GCP_SA_KEY       → JSON completo de la service account (con roles Cloud Run Admin
#                      + Artifact Registry Writer + Service Account User)
#   DATABASE_URL     → postgresql://...
#   SECRET_KEY       → clave JWT
#   GROQ_API_KEY     → gsk_...
#
# Pasos manuales ANTES de activar este workflow (ver README o CLAUDE.md):
#   1. Crear proyecto en console.cloud.google.com
#   2. Habilitar APIs: Cloud Run, Artifact Registry
#   3. Crear repo en Artifact Registry: us-central1-docker.pkg.dev/<PROJECT_ID>/taxops
#   4. Crear service account con los 3 roles mencionados
#   5. Descargar JSON key → pegar como GCP_SA_KEY en GitHub secrets

name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths:
      # Código que va dentro de la imagen Docker → rebuild necesario
      - 'api/**'
      - 'pipeline/**'
      - 'exogenas/**'
      - 'services/**'
      - 'db/**'
      - 'manage.py'
      - 'home_gate.py'
      # El propio workflow — cambios de configuración de deploy
      - '.github/workflows/deploy-cloud-run.yml'

env:
  REGION: us-central1
  SERVICE: taxops-api
  REPO: taxops

jobs:
  deploy:
    name: Build & Deploy → Cloud Run
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and push Docker image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/api:${{ github.sha }}"
          docker build -f api/Dockerfile-api -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image "$IMAGE" \
            --region ${{ env.REGION }} \
            --memory 2Gi \
            --cpu 1 \
            --timeout 600 \
            --max-instances 1 \
            --allow-unauthenticated \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --set-env-vars="^|^DATABASE_URL=${{ secrets.DATABASE_URL }}|SECRET_KEY=${{ secrets.SECRET_KEY }}|GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}|ALGORITHM=HS256|ACCESS_TOKEN_EXPIRE_MINUTES=30|REFRESH_TOKEN_EXPIRE_DAYS=7|ALLOWED_ORIGINS=https://taxops-app.vercel.app,http://localhost:3000"

      - name: Show service URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --format='value(status.url)')
          echo "### Deploy exitoso ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: $URL" >> $GITHUB_STEP_SUMMARY
          echo "- **Imagen**: \`$IMAGE\`" >> $GITHUB_STEP_SUMMARY
          echo "- **RAM**: 2 GB | **Timeout**: 600s | **Instancias**: máx 1" >> $GITHUB_STEP_SUMMARY

# TaxOps CI — GitHub Actions
# Corre en cada PR hacia main y en push directo a main.
# Gatea el merge (vía branch protection en Settings, opcional pero recomendado) y,
# transitivamente, el deploy — deploy-lambda.yml solo corre en push a main, que ya
# debería estar limpio si el PR pasó CI primero.
#
# Jobs:
#   api-lint    → flake8 + mypy sobre el backend FastAPI
#   api-test    → pytest (unitarios + integración con SQLite en memoria)
#   web-lint    → ESLint + TypeScript typecheck
#   web-build   → next build de prueba (valida que el bundle compila)

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {} # sigue disponible para correr manual si hace falta

# Cancela runs anteriores del mismo PR si llega uno nuevo
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. BACKEND — FastAPI / Python
  # ────────────────────────────────────────────────────────────
  api-lint:
    name: API · Lint & types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-api.txt

      - name: Install dependencies
        run: pip install flake8 mypy types-python-jose

      - name: flake8 — estilo PEP8
        run: flake8 api/ pipeline/ services/ --max-line-length=120 --exclude=__pycache__,.mypy_cache

  api-test:
    name: API · Tests
    runs-on: ubuntu-latest
    env:
      # En CI usamos SQLite en memoria (sin Postgres real)
      DATABASE_URL: sqlite:///./test.db
      SECRET_KEY: ci_secret_key_32chars_minimum_ok
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      ALLOWED_ORIGINS: http://localhost:3000
      # Groq no se llama en tests (mocked)
      GROQ_API_KEY: sk-test-not-real
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-api.txt

      - name: Install API dependencies
        run: pip install -r api/requirements-api.txt pytest pytest-asyncio httpx aiosqlite "moto[dynamodb,s3,sqs]"

      - name: Run tests
        run: pytest tests/ -v --tb=short --ignore=tests/test_e2e.py
        # test_e2e.py requiere Postgres real — se corre en staging, no en CI

  # ────────────────────────────────────────────────────────────
  # 2. FRONTEND — Next.js / TypeScript
  # ────────────────────────────────────────────────────────────
  web-lint:
    name: Web · Lint & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taxops-web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: taxops-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript typecheck
        run: npx tsc --noEmit

  web-build:
    name: Web · Build check
    runs-on: ubuntu-latest
    needs: web-lint       # Solo compila si lint pasa
    defaults:
      run:
        working-directory: taxops-web
    env:
      INTERNAL_API_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: taxops-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: next build
        run: npm run build

  # ────────────────────────────────────────────────────────────
  # 3. STATUS CHECK — requerido para merge en GitHub
  # ────────────────────────────────────────────────────────────
  all-checks-pass:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [api-lint, api-test, web-lint, web-build]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          if [[ "${{ needs.api-lint.result }}" != "success" || \
                "${{ needs.api-test.result }}" != "success" || \
                "${{ needs.web-lint.result }}" != "success" || \
                "${{ needs.web-build.result }}" != "success" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI checks passed"
